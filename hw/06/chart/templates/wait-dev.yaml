{{- if .Values.promotion.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: relay-wait-dev
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check-dev
          image: {{ .Values.promotion.checkerImage | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
              attempt=0
              while [ "$attempt" -lt 180 ]; do
                version=$(wget -q -T 3 -O - "$DEV_URL/version.json" || true)
                if printf '%s' "$version" | grep -Fq "\"revision\":\"$EXPECTED_REVISION\""; then
                  printf 'Verified dev source revision: %s\n' "$EXPECTED_REVISION"
                  exit 0
                fi
                attempt=$((attempt + 1))
                sleep 2
              done
              echo 'Expected source revision did not become ready in dev' >&2
              exit 1
          env:
            - name: EXPECTED_REVISION
              value: {{ .Values.sourceRevision | quote }}
            - name: DEV_URL
              value: {{ printf "http://relay.%s.svc.cluster.local" .Values.promotion.devNamespace | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
{{- end }}
