apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  resource.customizations.health.argoproj.io_Application: |
    local hs = {status = "Progressing", message = "Waiting for the selected revision and image"}
    if obj.status == nil or obj.status.sync == nil or obj.spec.source == nil then
      return hs
    end
    local sync = obj.status.sync
    if sync.status ~= "Synced" or sync.revision ~= obj.spec.source.targetRevision then
      return hs
    end
    local compared = sync.comparedTo and sync.comparedTo.source
    if compared == nil then return hs end
    local wanted = obj.spec.source.kustomize and obj.spec.source.kustomize.images or {}
    local actual = compared.kustomize and compared.kustomize.images or {}
    if #wanted ~= #actual then return hs end
    for index, image in ipairs(wanted) do
      if actual[index] ~= image then return hs end
    end
    if obj.status.health ~= nil then
      hs.status = obj.status.health.status
      hs.message = obj.status.health.message or "Selected revision and image reconciled"
    end
    return hs
