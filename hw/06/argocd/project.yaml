apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: relay-hw6-dev
  namespace: argocd
spec:
  description: CI-published Helm charts may deploy only to dev
  sourceRepos:
    - ghcr.io/itzephir/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: hw6-relay-dev
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: relay-hw6-prod
  namespace: argocd
spec:
  description: Reviewed Kubernetes configuration from Git for prod
  sourceRepos:
    - https://github.com/itzephir/hse-infra-course.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: hw6-relay-prod
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
