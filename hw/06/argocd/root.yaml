apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay-hw6-delivery
  namespace: argocd
spec:
  project: relay-hw6-delivery
  source:
    repoURL: https://github.com/itzephir/hse-infra-course.git
    targetRevision: gitops/hw6
    path: applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: false
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
