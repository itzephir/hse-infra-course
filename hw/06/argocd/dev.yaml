apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay-hw6-dev
  namespace: argocd
spec:
  project: relay-hw6-dev
  source:
    repoURL: ghcr.io/itzephir/charts
    chart: relay
    targetRevision: '*'
    helm:
      releaseName: relay
  destination:
    server: https://kubernetes.default.svc
    namespace: hw6-relay-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
