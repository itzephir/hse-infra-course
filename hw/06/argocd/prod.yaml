apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay-hw6-prod
  namespace: argocd
spec:
  project: relay-hw6
  source:
    repoURL: https://github.com/itzephir/hse-infra-course.git
    targetRevision: main
    path: hw/06/chart
    helm:
      releaseName: relay
      valuesObject:
        replicaCount: 2
        promotion:
          enabled: true
      parameters:
        - name: image.tag
          value: sha-$ARGOCD_APP_REVISION
          forceString: true
        - name: sourceRevision
          value: $ARGOCD_APP_REVISION
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: hw6-relay-prod
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
