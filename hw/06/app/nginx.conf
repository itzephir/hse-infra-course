server {
    listen 8080;
    server_name _;
    root /srv/site;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'relay\n';
    }
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
