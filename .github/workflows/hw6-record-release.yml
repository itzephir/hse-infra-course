name: HW6 record GitOps release

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      image:
        required: true
        type: string
    outputs:
      revision:
        description: Commit of the published GitOps configuration
        value: ${{ jobs.record.outputs.revision }}

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gitops/hw6
          path: deployment
      - name: Publish the selected immutable image to Git
        id: publish
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE: ${{ inputs.image }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 source/hw/06/scripts/publish-gitops.py \
            "$TARGET" "$IMAGE" "$SOURCE_SHA" source deployment
          git -C deployment config user.name 'github-actions[bot]'
          git -C deployment config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C deployment add -- "applications/$TARGET.yaml" ".releases/$TARGET.json"
          if ! git -C deployment diff --cached --quiet; then
            git -C deployment commit -m "deploy(hw6): $TARGET from $SOURCE_SHA"
            git -C deployment push origin HEAD:refs/heads/gitops/hw6
          fi
          echo "revision=$(git -C deployment rev-parse HEAD)" >> "$GITHUB_OUTPUT"
