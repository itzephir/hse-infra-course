apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay-hw6-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: relay-hw6
  source:
    repoURL: https://github.com/itzephir/hse-infra-course.git
    targetRevision: 3dcef7fc60b91bd73e252bd03ae297eba9d44bc6
    path: hw/06/manifests/overlays/dev
    kustomize:
      images:
        - relay=ghcr.io/itzephir/hse-infra-course@sha256:b1873763a760fd7562c708274307f9ecf5ca93434cba0d2d649996fc9594acc0
  destination:
    server: https://kubernetes.default.svc
    namespace: hw6-relay-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
