apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay-hw6-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: relay-hw6
  source:
    repoURL: https://github.com/itzephir/hse-infra-course.git
    targetRevision: 3e493ec7d33d1939f5dcb152c7e8b397a8d4864c
    path: hw/06/manifests/overlays/dev
    kustomize:
      images:
        - relay=ghcr.io/itzephir/hse-infra-course@sha256:3048a0f1b155aa467206c6f1748efe545e76f2f6bb8dc4033a463d78743b33f7
  destination:
    server: https://kubernetes.default.svc
    namespace: hw6-relay-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
