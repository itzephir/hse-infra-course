apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: relay-hw6-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: relay-hw6
  source:
    repoURL: https://github.com/itzephir/hse-infra-course.git
    targetRevision: 84aa7cdc89c4a5bf2b0c0ab2e6bf862741fdfd81
    path: hw/06/manifests/overlays/dev
    kustomize:
      images:
        - relay=ghcr.io/itzephir/hse-infra-course@sha256:905a42b856716afbb96493f4767324eb9344177733d375b207a27aeed500d056
  destination:
    server: https://kubernetes.default.svc
    namespace: hw6-relay-dev
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
